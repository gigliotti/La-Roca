<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Paleta de La Roca"><title>Paleta de La Roca</title><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&amp;family=Unbounded:wght@700&amp;display=swap');</style><rect width="1200" height="760" fill="#FFFFFF"/><text x="40" y="70" font-family="Unbounded, 'Arial Black', sans-serif" font-weight="700" font-size="34" fill="#0D1B26">Paleta de La Roca</text><text x="40" y="106" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#0D1B26">El naranja manda. Noche y magnesio ordenan. Durazno, lila y menta son los colores de las presas: acentos, no protagonistas.</text><rect x="40" y="140" width="420" height="330" rx="18" fill="#FF5A1F"/><text x="62" y="182" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="22" fill="#0D1B26">Naranja Ronda</text><text x="62" y="422" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#0D1B26">HEX #FF5A1F</text><text x="62" y="446" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#0D1B26">RGB 255 90 31</text><rect x="476" y="140" width="217.33" height="330" rx="18" fill="#C4400F"/><text x="498" y="182" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="22" fill="#F1F3F0">Naranja tostado</text><text x="498" y="422" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#F1F3F0">HEX #C4400F</text><text x="498" y="446" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#F1F3F0">RGB 196 64 15</text><rect x="709.33" y="140" width="217.33" height="330" rx="18" fill="#0D1B26"/><text x="731.33" y="182" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="22" fill="#F1F3F0">Noche atlántica</text><text x="731.33" y="422" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#F1F3F0">HEX #0D1B26</text><text x="731.33" y="446" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#F1F3F0">RGB 13 27 38</text><rect x="942.67" y="140" width="217.33" height="330" rx="18" fill="#F1F3F0" stroke="#D5DAD4"/><text x="964.67" y="182" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="22" fill="#0D1B26">Magnesio</text><text x="964.67" y="422" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#0D1B26">HEX #F1F3F0</text><text x="964.67" y="446" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#0D1B26">RGB 241 243 240</text><rect x="40" y="486" width="362.67" height="234" rx="18" fill="#FFB089"/><text x="62" y="528" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="22" fill="#0D1B26">Durazno</text><text x="62" y="672" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#0D1B26">HEX #FFB089</text><text x="62" y="696" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#0D1B26">RGB 255 176 137</text><rect x="418.67" y="486" width="362.67" height="234" rx="18" fill="#B49CFF"/><text x="440.67" y="528" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="22" fill="#0D1B26">Lila</text><text x="440.67" y="672" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#0D1B26">HEX #B49CFF</text><text x="440.67" y="696" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="17" fill="#0D1B26">RGB 180 156 255</text><rect x="797.33" y="486" width="362.67" height="234" rx="18" fill="#8EE0C3"/><text x="819.33" y="528" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="22" fill="#0D1B26">Menta</text><text x="819.33" y="672" font-family="'Instrument Sans'