UI', Arial, sans-serif" font-weight="400" font-size="23" fill="#0D1B26">Escalar te pide estar presente, leer el problema y animarte a soltar el miedo</text><text x="48" y="658" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="23" fill="#0D1B26">de a poco. Esa calma se queda con vos cuando bajás.</text><text x="48" y="720" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="23" fill="#0D1B26">AaBbCcDdEeFfGgHhIiJjKkLlMmNnÑñOoPpQqRrSsTtUuVvWwXxYyZz 0123456789</text><text x="48" y="760" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="17" fill="#4A5A66">Pesos 400, 500 y 600 · Google Fonts · licencia libre (OFL)</text><text x="48" y="812" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="17" fill="#4A5A66">El logo no usa estas tipografías: sus letras están dibujadas a mano. Estas son para títulos y textos.</text></svg>
