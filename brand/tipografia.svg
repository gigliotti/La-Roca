<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Tipografías de La Roca"><title>Tipografías de La Roca</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=DM+Serif+Display:ital@0;1&amp;display=swap');</style><rect width="1200" height="780" fill="#F3E3CF"/><text x="48" y="70" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="15" fill="#B03A10" letter-spacing="2.5">TÍTULOS</text><text x="48" y="150" font-family="'DM Serif Display', Georgia, serif" font-weight="400" font-size="76" fill="#102A40">DM Serif Display</text><text x="48" y="214" font-family="'DM Serif Display', Georgia, serif" font-weight="400" font-size="42" fill="#102A40">Primero la pared, después el mar.</text><text x="48" y="268" font-family="'DM Serif Display', Georgia, serif" font-weight="400" font-size="24" fill="#102A40">AaBbCcDdEeFfGgHhIiJjKkLlMmNnÑñOoPpQqRrSsTtUuVvWwXxYyZz 0123456789</text><text x="48" y="306" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="17" fill="#5F6B76">También en cursiva, para destacar una palabra · Google Fonts · licencia libre (OFL)</text><line x1="48" y1="350" x2="1152" y2="350" stroke="#E2D2BC" stroke-width="1.5"/><text x="48" y="410" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="15" fill="#B03A10" letter-spacing="2.5">TEXTO</text><text x="48" y="486" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="72" fill="#102A40">DM Sans</text><text x="48" y="546" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="23" fill="#102A40">En la pared no hay notificaciones: hay una presa, la siguiente y tu respiración.</text><text x="48" y="580" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="23" fill="#102A40">Escalar te pide estar presente y animarte a soltar el miedo de a poco.</text><text x="48" y="650" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="23" fill="#102A40">AaBbCcDdEeFfGgHhIiJjKkLlMmNnÑñOoPpQqRrSsTtUuVvWwXxYyZz 0123456789</text><text x="48" y="690" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="17" fill="#5F6B76">Pesos 400, 500 y 600 · Google Fonts · licencia libre (OFL)</text><text x="48" y="736" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="17" fill="#5F6B76">El logo no usa estas tipografías: sus letras (canto rodado) están dibujadas para La Roca.</text></svg>
